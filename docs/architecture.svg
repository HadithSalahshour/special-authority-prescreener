<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1320" role="img" aria-labelledby="title description">
  <title id="title">Special Authority pre-screening architecture</title>
  <desc id="description">A vertical flow from synthetic patient data through local hybrid retrieval, local policy evaluation, deterministic safety checks, and a clinician-reviewable pre-screen.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #475569; font-size: 16px; }
      .stage { fill: #334155; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
      .node-title { fill: #0f172a; font-size: 19px; font-weight: 650; }
      .node-copy { fill: #475569; font-size: 14px; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.25; marker-end: url(#arrow); }
      .join { fill: none; stroke: #64748b; stroke-width: 2.25; }
    </style>
  </defs>

  <rect x="16" y="16" width="868" height="1288" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="450" y="60" text-anchor="middle" class="title">Local pre-screening pipeline</text>
  <text x="450" y="88" text-anchor="middle" class="subtitle">Patient data stays on the host throughout evaluation</text>

  <text x="70" y="130" class="stage">01 · INPUT</text>
  <rect x="170" y="148" width="560" height="82" rx="14" fill="#e8f2ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="181" text-anchor="middle" class="node-title">Synthetic patient record</text>
  <text x="450" y="207" text-anchor="middle" class="node-copy">Structured visits and clinical documentation</text>

  <path d="M 450 230 V 330" class="connector"/>

  <text x="70" y="286" class="stage">02 · HYBRID RETRIEVAL</text>
  <rect x="70" y="302" width="760" height="350" rx="20" class="group"/>

  <rect x="230" y="330" width="440" height="76" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" class="node-title">Structured note chunks</text>
  <text x="450" y="387" text-anchor="middle" class="node-copy">Field-level facts with visit context</text>

  <path d="M 450 406 V 438 H 260 V 460" class="connector"/>
  <path d="M 450 438 H 640 V 460" class="connector"/>

  <rect x="100" y="460" width="320" height="78" rx="12" fill="#f0edff" stroke="#7c3aed" stroke-width="2"/>
  <text x="260" y="492" text-anchor="middle" class="node-title">Dense embeddings</text>
  <text x="260" y="518" text-anchor="middle" class="node-copy">Semantic similarity · local model</text>

  <rect x="480" y="460" width="320" height="78" rx="12" fill="#f0edff" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="492" text-anchor="middle" class="node-title">BM25 index</text>
  <text x="640" y="518" text-anchor="middle" class="node-copy">Exact-term keyword matching</text>

  <path d="M 260 538 V 558 H 450 V 574" class="connector"/>
  <path d="M 640 538 V 558 H 450" class="join"/>

  <rect x="250" y="574" width="400" height="58" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="450" y="610" text-anchor="middle" class="node-title">Reciprocal Rank Fusion</text>

  <path d="M 450 632 V 684 H 620 V 776" class="connector"/>

  <text x="70" y="708" class="stage">03 · CRITERION EVALUATION</text>
  <rect x="70" y="724" width="760" height="176" rx="20" class="group"/>

  <rect x="100" y="776" width="250" height="82" rx="12" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="225" y="809" text-anchor="middle" class="node-title">Policy cache</text>
  <text x="225" y="835" text-anchor="middle" class="node-copy">Locally generated criteria</text>

  <path d="M 350 817 H 438" class="connector"/>

  <rect x="450" y="776" width="340" height="82" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="809" text-anchor="middle" class="node-title">Local Ollama evaluation</text>
  <text x="620" y="835" text-anchor="middle" class="node-copy">Criterion-level evidence assessment</text>

  <path d="M 620 858 V 930 H 260 V 1006" class="connector"/>
  <path d="M 620 930 H 640 V 1006" class="connector"/>

  <text x="70" y="952" class="stage">04 · SAFETY GATE</text>
  <rect x="70" y="968" width="760" height="166" rx="20" class="group"/>

  <rect x="90" y="1006" width="340" height="80" rx="12" fill="#ecfdf3" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="1039" text-anchor="middle" class="node-title">Citation validation</text>
  <text x="260" y="1065" text-anchor="middle" class="node-copy">Verbatim evidence required</text>

  <rect x="470" y="1006" width="340" height="80" rx="12" fill="#ecfdf3" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="1039" text-anchor="middle" class="node-title">Threshold validation</text>
  <text x="640" y="1065" text-anchor="middle" class="node-copy">Deterministic numeric checks</text>

  <path d="M 260 1086 V 1152 H 450 V 1190" class="connector"/>
  <path d="M 640 1086 V 1152 H 450" class="join"/>

  <text x="70" y="1174" class="stage">05 · OUTPUT</text>
  <rect x="190" y="1190" width="520" height="82" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="1223" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Clinician-reviewable pre-screen</text>
  <text x="450" y="1249" text-anchor="middle" fill="#cbd5e1" font-size="14">Bounded conclusion with a per-criterion audit trail</text>
</svg>
